schema = 1
id = "muon"
name = "Muon"
version = "0.4.3"
api = "0.1"
description = "Muon: an independent Photon-inspired Horizon shader with a real sun/moon shadow map, cloud shadows, an irregular deep-water wave spectrum, the engine water mirror, volumetric cumulus in the sky stage, GTAO, SSR, screen-space volumetric light, bloom, a filmic colour grade, a display-referred LUT and HDR output. Credits in README.md."
shared = ["common.wgsl"]

# The pack draws the whole Overworld sky itself. Turning the engine's own sun,
# stars and clouds off is what removes vanilla's flat cloud layer from the
# picture; the moon is still the engine's, so the pack only adds its halo.
[sky]
file = "sky.wgsl"
clouds = false
sun = false
stars = false

# `fog = false`: the pack applies the reference's atmosphere/underwater extinction in
# the post pass, so the engine must not pre-fog the terrain toward vanilla blue.
[material]
file = "material.wgsl"
fog = false

# Rain and snow streaks, lit by the pack and hidden when the camera is in water.
[weather]
file = "weather.wgsl"

# A real shadow map: the sun by day, the moon by night. the reference's contrast comes
# mostly from this, not from the colour grade.
[shadow]
resolution = 2048
distance = 128.0
option = "shadows_enabled"
solid_materials = [10, 11]

# The engine's water mirror, drawn only while the player keeps reflections on.
[reflection]
option = "reflections"

# Display-referred 3D LUT, baked as a 2D atlas: 33 slices of 33x33 laid out
# horizontally (width 1089, height 33). Replace lut.png with your own atlas,
# or convert a .cube with tools/cube_to_lut_png.py.
[[textures]]
id = "lut"
file = "lut.png"
filter = "linear"
wrap = "clamp"

# Sprite ids the material stage uses to recognise foliage. A stage sees the
# sprite, not the block, so these match every leaves/plant sprite.
[[materials]]
id = 10
sprites = ["block/*_leaves", "block/mangrove_roots", "block/azalea"]

[[materials]]
id = 11
sprites = ["block/*_sapling", "block/short_grass", "block/tall_grass", "block/fern", "block/large_fern", "block/dandelion", "block/poppy", "block/*_tulip", "block/dead_bush", "block/wheat", "block/carrots", "block/potatoes", "block/beetroots", "block/sugar_cane", "block/*_bush"]

[[materials]]
id = 12
sprites = ["block/water_still", "block/water_flow", "block/water_overlay"]

# --- post chain ---
[[post]]
file = "post/gtao.wgsl"
name = "GTAO"

[[post]]
file = "post/ao_blur.wgsl"
name = "AO denoise"

[[post]]
file = "post/ssr.wgsl"
name = "SSR"

[[post]]
file = "post/volumetrics.wgsl"
name = "Volumetric light, haze and water fog"

[[post]]
file = "post/grade.wgsl"
name = "Bloom, grade, tonemap"

[[post]]
file = "post/fxaa.wgsl"
name = "FXAA"

[[post]]
file = "post/final.wgsl"
name = "CAS, dither, output"

