# ------------------------------------------------------------------------------
#
#  Material classification for the geometry stages. Iris exposes these ids to the
#  shader as mc_Entity.x, and Muon's classifier maps 10000+n back to a material.
#  Everything that Decides shading comes from LabPBR; this file only covers the
#  cases the texture format cannot express (foliage that scatters, blocks that
#  emit light without an emissive map, metals without a specular map).
#
# ==============================================================================

# ------------------------------------------------------------------------------
#  Leaves (10001) - subsurface scattering, wind sway, dappled shadows
# ------------------------------------------------------------------------------

block.10001 = minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves \
    minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves \
    minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves \
    minecraft:flowering_azalea_leaves minecraft:pale_oak_leaves \
    minecraft:oak_leaves minecraft:vine minecraft:glow_lichen

# ------------------------------------------------------------------------------
#  Ground foliage (10002) - strong wind sway, subsurface scattering
# ------------------------------------------------------------------------------

block.10002 = minecraft:short_grass minecraft:tall_grass minecraft:fern \
