# ============================================================================
#  Muon Shaders - block.properties
#
#  Assigns a numeric id to groups of blocks. The id becomes mc_Entity.x in the
#  gbuffer vertex shaders and is translated into a Muon material mask by
#  material_mask_from_block_id() in lib/materials.glsl.
#
#  Material ids (keep in sync with lib/materials.glsl):
#     1  grass / plants          11  ice
#     2  leaves                  12  emissive
#     3  water                   13  lava
#     4  glass / translucent     14  underwater plants
#     5  metal                   15  cloth / wool
#     6  stone / deepslate       16  cross-model flowers
#     7  wood / planks           17  vines / crops
#     8  sand                    18  nether blocks
#     9  dirt / gravel           19  end blocks
#    10  snow                    20  copper / oxidized metal
#
#  Unknown block names are ignored by Iris with a warning, so this list is
#  safe to extend. Names are the post-1.13 registry names.
# ============================================================================

# --- 1: grass and ground cover ------------------------------------------------
block.1 = minecraft:grass_block minecraft:podzol minecraft:mycelium minecraft:dirt_path \
          minecraft:short_grass minecraft:grass minecraft:tall_grass minecraft:fern \
          minecraft:large_fern minecraft:dead_bush minecraft:seagrass minecraft:tall_seagrass

