screen.pom= POM POM_DEPTH POM_SAMPLES POM_DISTANCE
screen.exposure= AUTO_EXPOSURE EXPOSURE_BIAS EXPOSURE_MIN EXPOSURE_MAX EXPOSURE_SPEED <empty> <empty> MANUAL_EXPOSURE EXPOSURE_BRIGHTNESS
screen.bloom= BLOOM BLOOM_INTENSITY BLOOM_THRESHOLD BLOOM_SPREAD
screen.lens= VIGNETTE VIGNETTE_INTENSITY CHROMATIC_ABERRATION CHROMATIC_ABERRATION_INTENSITY FILM_GRAIN FILM_GRAIN_INTENSITY CLARITY CLARITY_INTENSITY
screen.aa= TAA TAA_CLIP_STRENGTH TAA_HISTORY_WEIGHT FXAA CAS CAS_INTENSITY

# Columns
screen.light_sources.columns= 1
screen.stars.columns= 1
screen.galaxy.columns= 1
screen.exposure.columns= 1
screen.reflections.columns= 1
screen.pom.columns= 1
screen.raytracing.columns= 1
screen.post.columns= 2
