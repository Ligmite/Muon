# ------------------------------------------------------------------------------
#
#  Everything the in-game Iris menu shows is declared here: the seven profiles,
#  the screen tree, the slider declarations, the render-target configuration and
#  the custom textures. Option defaults live in shaders/settings.glsl; a profile
#  only has to name what differs from the High preset, which is the pack's
#  default state.
#
# ==============================================================================

# ------------------------------------------------------------------------------
#  Profiles
#
#  Order is significant: Iris renders the profile buttons in declaration order.
#  High is the default, and the values in settings.glsl match this profile
#  exactly, so a fresh install starts on High without anything being applied.
# ------------------------------------------------------------------------------

profile.low        = QUALITY=0 SHADOW_SAMPLES=8 !PCSS !SHADOW_SSRT !GTAO SSAO SSAO_SAMPLES=6 !SUBSURFACE_SCATTERING !CLOUDS !VOLUMETRIC_FOG !GOD_RAYS !PARALLAX !SCREENSPACE_REFLECTIONS !RTGI !TAA FXAA !BLOOM !DEPTH_OF_FIELD !LENS_FLARE !COLOR_GRADING shadowMapResolution=1024 shadowDistance=96.0 FOG_STEPS=6 CLOUD_STEPS=16
profile.medium     = QUALITY=1 SHADOW_SAMPLES=12 PCSS !SHADOW_SSRT GTAO !SSAO !SUBSURFACE_SCATTERING CLOUDS VOLUMETRIC_FOG GOD_RAYS PARALLAX SCREENSPACE_REFLECTIONS !RTGI TAA BLOOM !DEPTH_OF_FIELD LENS_FLARE shadowMapResolution=2048 shadowDistance=128.0 FOG_STEPS=10 CLOUD_STEPS=28
profile.high       = QUALITY=2 SHADOW_SAMPLES=16 PCSS SHADOW_SSRT GTAO SUBSURFACE_SCATTERING CLOUDS VOLUMETRIC_FOG GOD_RAYS PARALLAX SCREENSPACE_REFLECTIONS !RTGI TAA BLOOM !DEPTH_OF_FIELD LENS_FLARE shadowMapResolution=2048 shadowDistance=160.0 FOG_STEPS=12 CLOUD_STEPS=40
profile.ultra      = QUALITY=3 SHADOW_SAMPLES=24 PCSS SHADOW_SSRT GTAO SUBSURFACE_SCATTERING CLOUDS VOLUMETRIC_FOG GOD_RAYS PARALLAX SCREENSPACE_REFLECTIONS !RTGI TAA BLOOM DEPTH_OF_FIELD LENS_FLARE WATER_CAUSTICS shadowMapResolution=4096 shadowDistance=256.0 FOG_STEPS=24 CLOUD_STEPS=64
profile.raytraced  = QUALITY=3 SHADOW_SAMPLES=24 PCSS SHADOW_SSRT GTAO SUBSURFACE_SCATTERING CLOUDS VOLUMETRIC_FOG GOD_RAYS PARALLAX SCREENSPACE_REFLECTIONS RTGI RTGI_BOUNCES=1 RTGI_SAMPLES=2 RTGI_STEPS=12 RTGI_RADIUS=4.00 TAA BLOOM DEPTH_OF_FIELD LENS_FLARE WATER_CAUSTICS shadowMapResolution=4096 shadowDistance=256.0 CLOUD_STEPS=64
profile.rtgi       = QUALITY=3 SHADOW_SAMPLES=24 PCSS SHADOW_SSRT GTAO SUBSURFACE_SCATTERING CLOUDS VOLUMETRIC_FOG GOD_RAYS PARALLAX SCREENSPACE_REFLECTIONS RTGI RTGI_BOUNCES=2 RTGI_SAMPLES=4 RTGI_STEPS=16 RTGI_RADIUS=6.00 TAA BLOOM !DEPTH_OF_FIELD LENS_FLARE WATER_CAUSTICS shadowMapResolution=4096 shadowDistance=256.0 CLOUD_STEPS=64
profile.ptgi       = QUALITY=3 SHADOW_SAMPLES=24 PCSS SHADOW_SSRT GTAO SUBSURFACE_SCATTERING CLOUDS VOLUMETRIC_FOG GOD_RAYS PARALLAX SCREENSPACE_REFLECTIONS RTGI RTGI_BOUNCES=3 RTGI_SAMPLES=8 RTGI_STEPS=32 RTGI_RADIUS=10.00 TAA BLOOM !DEPTH_OF_FIELD LENS_FLARE WATER_CAUSTICS shadowMapResolution=4096 shadowDistance=320.0 CLOUD_STEPS=96

profile.low.comment       = Maximum performance. Screen-space AO, vanilla-cloud-free sky, no volumetrics.
profile.medium.comment    = Balanced. Ambient occlusion, clouds and volumetric fog at reduced cost.
profile.high.comment      = The intended Muon look: PCSS shadows, volumetric clouds and fog, SSR, TAA.
profile.ultra.comment     = High plus depth of field, caustics and a larger shadow map.
profile.raytraced.comment = Ultra plus one-bounce screen-space path-traced global illumination.
profile.rtgi.comment      = Two-bounce RTGI with a wider gather radius.
profile.ptgi.comment      = Three-bounce RTGI at the highest sample count.

# ------------------------------------------------------------------------------
#  Screens
# ------------------------------------------------------------------------------

screen = <profile> <empty> <empty> [world] [lighting] [sky] [atmosphere] [clouds] <empty> [materials] [water] [post] <empty> <empty> <empty> [misc] [mods]

screen.world     = [weather] WAVING_PLANTS WAVING_LEAVES SWAY_STRENGTH <empty> <empty> [exposure] AUTO_EXPOSURE EXPOSURE_BIAS EXPOSURE_SPEED MANUAL_EXPOSURE
screen.lighting  = [shadows] [ao] [light_sources] <empty> [sss] SUNLIGHT MOONLIGHT AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH MINIMUM_LIGHT CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH BOUNCED_LIGHT BOUNCED_LIGHT_STRENGTH
screen.sky       = SUN_DISC SUN_ANGULAR_RADIUS MOON_DISC STARS STARS_INTENSITY SKY_SATURATION SKY_GROUND_TINT GOD_RAYS GOD_RAYS_STRENGTH GOD_RAYS_STEPS
screen.atmosphere = ATMOSPHERE ATMOSPHERE_HAZE ATMOSPHERE_MIE <empty> <empty> VOLUMETRIC_FOG FOG_STEPS FOG_STRENGTH FOG_RAIN_STRENGTH CAVE_FOG CAVE_FOG_STRENGTH
screen.clouds    = CLOUDS CLOUD_STEPS CLOUD_LIGHTING_STEPS CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SCALE CLOUD_AMBIENT_STRENGTH <empty> CLOUD_WIND_SPEED CLOUD_WIND_ANGLE
screen.materials = NORMAL_MAPPING SPECULAR_MAPPING [parallax] EMISSION_STRENGTH HARDCODED_F0 HARDCODED_F0_VALUE [reflections]
screen.water     = [water_waves] WATER_REFRACTION WATER_REFRACTION_STRENGTH WATER_CAUSTICS WATER_CAUSTICS_STRENGTH [water_optics] WATER_REFLECTION_STRENGTH
screen.post      = TONEMAP_MODE TONEMAP_EXPOSURE_PRESCALE TONEMAP_WHITE_POINT <empty> BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_RADIUS <empty> [dof] [aa] [grading] [lens] VIGNETTE VIGNETTE_STRENGTH SHARPEN SHARPEN_STRENGTH CHROMATIC_ABERRATION FILM_GRAIN DITHER
screen.misc      = [developer] DEBUG_VIEW
screen.mods      = DH_RENDER DH_SHADOWS DH_WATER DH_NOISE DH_NOISE_STRENGTH

# World submenus
screen.weather          = WETNESS RAIN_PUDDLES PUDDLE_STRENGTH SNOW_COVER SNOW_STRENGTH

# Lighting submenus
screen.shadows          = SHADOW SHADOW_SAMPLES PCSS PCSS_SOFTNESS SHADOW_SSRT SHADOW_SSRT_STEPS SHADOW_SSRT_DISTANCE <empty> shadowMapResolution shadowDistance sunPathRotation
screen.ao               = GTAO SSAO GTAO_SLICES GTAO_STEPS GTAO_RADIUS GTAO_STRENGTH SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH
screen.light_sources    = SUNLIGHT MOONLIGHT AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH BOUNCED_LIGHT_STRENGTH
screen.sss              = SUBSURFACE_SCATTERING SSS_STRENGTH SSS_STEPS SSS_RADIUS

# Materials submenus
screen.parallax         = PARALLAX POM_DEPTH POM_SAMPLES POM_REFINE_STEPS POM_SELF_SHADOW POM_SHADOW_SAMPLES POM_DISTANCE
screen.reflections      = SCREENSPACE_REFLECTIONS SSR_STEPS SSR_REFINE_STEPS SSR_ROUGHNESS SSR_MAX_DISTANCE SSR_STRENGTH SSR_EDGE_FADE <empty> RTGI RTGI_BOUNCES RTGI_SAMPLES RTGI_STEPS RTGI_RADIUS RTGI_STRENGTH RTGI_DENOISE RTGI_DENOISE_STRENGTH

# Water submenus
screen.water_waves      = WATER_WAVES WATER_EXTRUDE WATER_WAVE_STRENGTH WATER_WAVE_ITERATIONS WATER_WAVE_SPEED WATER_WAVE_HEIGHT
screen.water_optics     = WATER_FOG WATER_ABSORPTION_R WATER_ABSORPTION_G WATER_ABSORPTION_B WATER_SCATTERING

# Post submenus
screen.dof              = DEPTH_OF_FIELD DOF_AUTOFOCUS DOF_FOCUS DOF_APERTURE DOF_STRENGTH DOF_SAMPLES DOF_HAND_BLUR
screen.aa               = TAA TAA_STRENGTH TAA_CLIPPING FXAA FXAA_STRENGTH
screen.grading          = COLOR_GRADING GRADE_BRIGHTNESS GRADE_CONTRAST GRADE_SATURATION GRADE_TEMPERATURE GRADE_TINT GRADE_SHADOW_TINT
screen.lens             = LENS_FLARE LENS_FLARE_STRENGTH LENS_FLARE_GHOSTS

# Misc submenus
screen.developer        = DEBUG_VIEW
screen.exposure         = AUTO_EXPOSURE EXPOSURE_BIAS EXPOSURE_MIN EXPOSURE_MAX EXPOSURE_SPEED MANUAL_EXPOSURE

# ------------------------------------------------------------------------------
#  Layout
# ------------------------------------------------------------------------------

screen.post.columns        = 2
screen.weather.columns     = 2
screen.ao.columns          = 2
screen.shadows.columns     = 2
screen.water_optics.columns = 2
screen.grading.columns     = 2
screen.dof.columns         = 1
screen.aa.columns          = 2

# ------------------------------------------------------------------------------
#  Sliders
# ------------------------------------------------------------------------------

sliders = shadowMapResolution shadowDistance sunPathRotation SWAY_STRENGTH PUDDLE_STRENGTH SNOW_STRENGTH SHADOW_SAMPLES PCSS_SOFTNESS SHADOW_SSRT_STEPS SHADOW_SSRT_DISTANCE CLOUD_SHADOW_STRENGTH SUNLIGHT MOONLIGHT AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH MINIMUM_LIGHT BOUNCED_LIGHT_STRENGTH GTAO_SLICES GTAO_STEPS GTAO_RADIUS GTAO_STRENGTH SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH SSS_STRENGTH SSS_STEPS SSS_RADIUS ATMOSPHERE_HAZE ATMOSPHERE_MIE SKY_SATURATION SKY_GROUND_TINT SUN_ANGULAR_RADIUS STARS_INTENSITY CLOUD_STEPS CLOUD_LIGHTING_STEPS CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SCALE CLOUD_AMBIENT_STRENGTH CLOUD_WIND_SPEED CLOUD_WIND_ANGLE FOG_STEPS FOG_STRENGTH FOG_RAIN_STRENGTH CAVE_FOG_STRENGTH GOD_RAYS_STRENGTH GOD_RAYS_STEPS WATER_WAVE_STRENGTH WATER_WAVE_ITERATIONS WATER_WAVE_SPEED WATER_WAVE_HEIGHT WATER_REFRACTION_STRENGTH WATER_CAUSTICS_STRENGTH WATER_ABSORPTION_R WATER_ABSORPTION_G WATER_ABSORPTION_B WATER_SCATTERING WATER_REFLECTION_STRENGTH HARDCODED_F0_VALUE EMISSION_STRENGTH POM_DEPTH POM_SAMPLES POM_REFINE_STEPS POM_SHADOW_SAMPLES POM_DISTANCE SSR_STEPS SSR_REFINE_STEPS SSR_MAX_DISTANCE SSR_STRENGTH SSR_EDGE_FADE RTGI_BOUNCES RTGI_SAMPLES RTGI_STEPS RTGI_RADIUS RTGI_STRENGTH RTGI_DENOISE_STRENGTH TAA_STRENGTH TAA_CLIPPING FXAA_STRENGTH EXPOSURE_BIAS EXPOSURE_MIN EXPOSURE_MAX EXPOSURE_SPEED MANUAL_EXPOSURE TONEMAP_EXPOSURE_PRESCALE TONEMAP_WHITE_POINT BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_RADIUS DOF_STRENGTH DOF_APERTURE DOF_SAMPLES DOF_FOCUS LENS_FLARE_STRENGTH LENS_FLARE_GHOSTS GRADE_BRIGHTNESS GRADE_CONTRAST GRADE_SATURATION GRADE_TEMPERATURE GRADE_TINT GRADE_SHADOW_TINT VIGNETTE_STRENGTH SHARPEN_STRENGTH CHROMATIC_ABERRATION FILM_GRAIN DH_NOISE_STRENGTH

# ------------------------------------------------------------------------------
#  Render targets
#
#  The layout is documented in docs/buffers.md. Every target listed here is used
#  by at least one pass; the reserved index 7 carries the screen-space global
#  illumination field.
# ------------------------------------------------------------------------------

colortex0Format  = RGBA16F
colortex1Format  = RGBA16F
colortex2Format  = RGBA16F
colortex3Format  = RGBA16F
colortex4Format  = RGBA8
colortex5Format  = RGBA16F
colortex6Format  = RGBA16F
colortex7Format  = RGBA16F
colortex8Format  = RGBA16F
colortex9Format  = RGBA16F
colortex10Format = RGBA16F
colortex11Format = RGBA16F
colortex12Format = RGBA16F
colortex13Format = RGBA16F
colortex14Format = RGBA16F
colortex15Format = RGBA16F

# Bloom pyramid: the base level is written by composite5 and Iris generates the
# mip chain, which composite6 samples in one pass.
colortex6MipmapEnabled = true

# Half-resolution ambient occlusion.
size.buffer.colortex14 = 0.5 0.5

# 64x64 exposure reduction.
size.buffer.colortex12 = 64 64

# ------------------------------------------------------------------------------
#  Buffer flips
#
#  Iris cannot bind one texture as both a sampler and a draw target. These four
#  passes genuinely need to read what they write, so each gets a flipped buffer.
# ------------------------------------------------------------------------------

flip.deferred2.colortex0  = true
flip.composite.colortex12 = true
flip.composite1.colortex7 = true
flip.composite3.colortex5 = true

# ------------------------------------------------------------------------------
#  Blending
#
#  Every geometry stage writes a g-buffer rather than a colour, so hardware
#  blending must be off for all of them. The scene colour is composited in the
#  deferred and composite chain instead.
# ------------------------------------------------------------------------------

blend.gbuffers_terrain                = off
blend.gbuffers_terrain_solid          = off
blend.gbuffers_terrain_cutout         = off
blend.gbuffers_entities               = off
blend.gbuffers_entities_glowing       = off
blend.gbuffers_block                  = off
blend.gbuffers_item                   = off
blend.gbuffers_hand                   = off
blend.gbuffers_basic                  = off
blend.gbuffers_line                   = off
blend.gbuffers_textured               = off
blend.gbuffers_textured_lit           = off
blend.gbuffers_beaconbeam             = off
blend.gbuffers_spidereyes             = off
blend.gbuffers_damagedblock           = off
blend.gbuffers_lightning              = off
blend.gbuffers_water                  = off
blend.gbuffers_hand_water             = off
blend.gbuffers_entities_translucent   = off
blend.gbuffers_block_translucent      = off
blend.gbuffers_particles_translucent  = off
blend.gbuffers_particles              = off
blend.gbuffers_armor_glint            = off
blend.gbuffers_weather                = off
blend.gbuffers_skybasic               = off
blend.gbuffers_skytextured            = off
blend.gbuffers_clouds                 = off
blend.shadow                          = off
blend.shadow_solid                    = off
blend.shadow_cutout                   = off
blend.shadow_entities                 = off
blend.shadow_block                    = off
blend.shadow_water                    = off
blend.dh_terrain                      = off
blend.dh_water                        = off

# ------------------------------------------------------------------------------
#  Program toggles
# ------------------------------------------------------------------------------

program.shadow.enabled     = SHADOW
program.composite4.enabled = DEPTH_OF_FIELD

program.world0/shadow.enabled     = SHADOW
program.world0/composite4.enabled = DEPTH_OF_FIELD
program.world1/shadow.enabled     = SHADOW
program.world1/composite4.enabled = DEPTH_OF_FIELD
program.world-1/shadow.enabled     = SHADOW
program.world-1/composite4.enabled = DEPTH_OF_FIELD

# ------------------------------------------------------------------------------
#  Vanilla elements
#
#  Muon draws its own sky, sun, moon, stars and clouds. The vanilla versions are
#  suppressed so they cannot double up with the atmosphere in deferred1.
# ------------------------------------------------------------------------------

sun = false
moon = false
stars = false
clouds = off
vignette = off
underwaterOverlay = false

# ------------------------------------------------------------------------------
#  Textures
# ------------------------------------------------------------------------------

texture.noise = image/noise.png

# Tiled Perlin-Worley base volume for the cloud density field.
texture.deferred1.muonCloudNoise = image/cloud_noise_3d.dat TEXTURE_3D R8 64 64 64 RED UNSIGNED_BYTE
texture.deferred1.muonDetailNoise = image/worley_3d.dat TEXTURE_3D R8 32 32 32 RED UNSIGNED_BYTE

# The translucent pass calls the shared cloud-shadow function through
# lib/common/surface.glsl, so it needs the same volume.
texture.deferred2.muonCloudNoise = image/cloud_noise_3d.dat TEXTURE_3D R8 64 64 64 RED UNSIGNED_BYTE
texture.deferred2.muonDetailNoise = image/worley_3d.dat TEXTURE_3D R8 32 32 32 RED UNSIGNED_BYTE

#--------------------------------------------------------------------------------
#  Iris feature requirements
#  Muon uses no custom images or SSBOs in v0.0.1, so it runs on any Iris build
#  that supports the shader pack format, including the Vulkan pathway.
#--------------------------------------------------------------------------------
