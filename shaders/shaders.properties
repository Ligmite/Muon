screen.clouds= CLOUDS CLOUDS_SCALE CLOUDS_WIND_SPEED CLOUDS_WIND_ANGLE CLOUDS_COVERAGE_BIAS CLOUDS_SUN_ABSORPTION CLOUDS_MULTIPLE_SCATTERING <empty> [clouds_cumulus] [clouds_congestus] [clouds_altocumulus] [clouds_cirrus]
