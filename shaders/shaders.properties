# ----------------------------------------------------------------------------
#  Loader hints
# ----------------------------------------------------------------------------

clouds              = off
oldLighting         = false
oldHandLight        = false
dynamicHandLight    = true
separateAo          = true
underwaterOverlay   = false
vignette            = false
rain.depth          = false
shadowEntities      = true
shadowBlockEntities = true

iris.features.optional = CUSTOM_IMAGES ENTITY_TRANSLUCENT

# ----------------------------------------------------------------------------
#  Buffer formats
# ----------------------------------------------------------------------------

colortex0Format  = RGBA16F  # scene colour (HDR, linear Rec.709 working space)
colortex1Format  = RGBA16   # gbuffer: albedo.rgb, material id
colortex2Format  = RGBA16   # gbuffer: normal.xy (octahedral), roughness, metalness
colortex3Format  = RGBA16   # gbuffer: emission, subsurface, ao, f0
colortex4Format  = RGBA16   # ambient occlusion (half resolution)
colortex5Format  = RGBA16F  # TAA history / SSR source
colortex6Format  = RGBA16F  # volumetric scattering (half resolution)
colortex7Format  = RGBA16F  # clouds (half resolution)
colortex8Format  = RGBA16F  # ray tracing result
colortex9Format  = RGBA16   # translucent extras: normal.xy, depth, flags
colortex10Format = RGBA16F  # translucent colour (premultiplied)
colortex11Format = RGBA16F  # composite / DOF scratch
colortex12Format = RGBA16F  # ray tracing history
colortex13Format = RGBA16F  # tonemapped colour
colortex14Format = RGBA16   # light levels: skylight, blocklight, porosity, wetness
colortex15Format = RGBA16F  # spare

# ----------------------------------------------------------------------------
#  Buffer sizes
# ----------------------------------------------------------------------------

size.buffer.colortex4 = 0.5 0.5
size.buffer.colortex6 = 0.5 0.5
size.buffer.colortex7 = 0.5 0.5

# ----------------------------------------------------------------------------
#  Blending
#
#  The translucent G-buffer stores premultiplied colour in colortex10, so the
#  blend equation is ONE / ONE_MINUS_SRC_ALPHA for both colour and alpha.
# ----------------------------------------------------------------------------

blend.gbuffers_water                 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water            = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent  = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent     = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather               = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.dh_water                       = off
blend.dh_terrain                     = off
blend.dh_generic                     = off

# ----------------------------------------------------------------------------
#  Program availability
# ----------------------------------------------------------------------------

# We render our own clouds, so vanilla's cloud program is unused.
program.gbuffers_clouds.enabled = false
