# ----------------------------------------------------------------------------

screen= <profile> <empty> <empty> [world] [lighting] [sky] [clouds] [atmosphere] [water] [materials] [reflections] [raytracing] [post] [color] [misc]

screen.world= [weather] WAVING_PLANTS WAVING_LEAVES WIND_STRENGTH EDGE_HIGHLIGHT EDGE_HIGHLIGHT_SCALE RAIN_OPACITY MOON_PHASE_AFFECTS_BRIGHTNESS SEA_LEVEL VANILLA_CLOUDS_LAYER
screen.weather= <empty> <empty> <empty>
screen.lighting= [shadows] [ao] [light_sources] <empty> HANDHELD_LIGHTING HANDHELD_LIGHTING_INTENSITY CLOUD_SHADOWS CLOUD_SHADOWS_INTENSITY SSS_SHEEN SSS_INTENSITY SHADING_STRENGTH MINIMUM_LIGHT
