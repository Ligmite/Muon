# ============================================================================
#  Muon Shaders - shaders.properties
#  An Iris shader pack (Iris 1.7+ required). OptiFine support is best effort.
# ============================================================================

# ----------------------------------------------------------------------------
#  Profiles
# ----------------------------------------------------------------------------

profile.low= SHADER_AO=1 !VOLUMETRIC_LIGHTING !CLOUDS_CUMULUS_CONGESTUS !CLOUDS_CIRRUS REFLECTIONS=0 !POM !SHADOW_SSRT !WATER_CAUSTICS RAY_TRACING=0 !TAA !DOF !MOTION_BLUR BLOOM_INTENSITY=0.06 shadowMapResolution=1024 shadowDistance=96.0 VL_STEPS=8 CLOUDS_CUMULUS_STEPS=16 GTAO_SLICES=3 GTAO_HORIZON_STEPS=4 SSAO_STEPS=6 SSR_STEPS=12 FXAA
profile.medium= SHADER_AO=1 VOLUMETRIC_LIGHTING CLOUDS_CUMULUS_CONGESTUS !CLOUDS_CIRRUS REFLECTIONS=1 !POM SHADOW_SSRT !WATER_CAUSTICS RAY_TRACING=0 TAA !DOF MOTION_BLUR shadowMapResolution=2048 shadowDistance=128.0 VL_STEPS=12 CLOUDS_CUMULUS_STEPS=24 GTAO_SLICES=4 GTAO_HORIZON_STEPS=5 SSAO_STEPS=8 SSR_STEPS=16 FXAA
profile.high= SHADER_AO=2 VOLUMETRIC_LIGHTING CLOUDS_CUMULUS_CONGESTUS CLOUDS_CIRRUS REFLECTIONS=2 POM SHADOW_SSRT WATER_CAUSTICS RAY_TRACING=0 TAA DOF MOTION_BLUR shadowMapResolution=2048 shadowDistance=160.0 VL_STEPS=16 CLOUDS_CUMULUS_STEPS=32 GTAO_SLICES=5 GTAO_HORIZON_STEPS=6 SSR_STEPS=24 FXAA CAS
profile.ultra= SHADER_AO=2 VOLUMETRIC_LIGHTING CLOUDS_CUMULUS_CONGESTUS CLOUDS_CIRRUS REFLECTIONS=2 POM SHADOW_SSRT WATER_CAUSTICS RAY_TRACING=0 TAA DOF MOTION_BLUR shadowMapResolution=3072 shadowDistance=224.0 VL_STEPS=24 CLOUDS_CUMULUS_STEPS=48 GTAO_SLICES=6 GTAO_HORIZON_STEPS=8 SSR_STEPS=48 FXAA CAS
profile.pathtraced= SHADER_AO=2 VOLUMETRIC_LIGHTING CLOUDS_CUMULUS_CONGESTUS CLOUDS_CIRRUS REFLECTIONS=2 POM SHADOW_SSRT WATER_CAUSTICS RAY_TRACING=3 RT_MAX_BOUNCES=4 RT_SAMPLES_PER_PIXEL=1 RT_TEMPORAL_ACCUMULATION RT_DENOISE TAA DOF MOTION_BLUR shadowMapResolution=2048 shadowDistance=128.0 VL_STEPS=16 CLOUDS_CUMULUS_STEPS=32 FXAA CAS

# ----------------------------------------------------------------------------
